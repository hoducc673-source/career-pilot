[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "career-pilot"
version = "0.1.0"
description = "Evidence-based career exploration and job application agent"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.49,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
